[project]
name = "agentforge"
version = "1.0.0"
description = "Production-grade multi-agent research engine powered by LangGraph and MCP"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function call in argument defaults (Pydantic Field)
    "SIM108", # use ternary operator — readability trade-off
    "UP006",  # use builtin list/dict — codebase uses typing.List/Dict consistently
    "UP007",  # use X | Y for union types — keep Optional[] for clarity
    "UP035",  # deprecated typing imports — codebase uses typing.List/Dict/Optional
    "UP042",  # replace str enum — StrEnum requires 3.11, keep (str, Enum) for clarity
    "UP045",  # non-pep604-optional — keep Optional[] for readability
    "N805",   # first argument of a method should be named self — pydantic validators
    "N806",   # non-lowercase variable in function — test mocks use PascalCase
    "TC001",  # type-checking-only first-party import — keep runtime imports simple
    "TC002",  # type-checking-only third-party import — keep runtime imports simple
    "TC003",  # type-checking-only stdlib import — keep runtime imports simple
    "RUF001", # ambiguous unicode chars — en-dashes in agent prompts are intentional
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = ["asyncio: marks tests as async"]

[tool.coverage.run]
source = ["src"]
omit = ["src/mcp_servers/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "except ImportError",
]
