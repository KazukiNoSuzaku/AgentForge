name: Deploy to Streamlit Cloud

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Streamlit App
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Streamlit app imports
        run: python -c "import streamlit_app; print('App module loads successfully')"
        env:
          ANTHROPIC_API_KEY: "sk-ant-validation-only"

      - name: Run tests before deploy
        run: pytest tests/ -v --tb=short
        env:
          ANTHROPIC_API_KEY: "sk-ant-validation-only"

      # ----------------------------------------------------------------
      # Streamlit Community Cloud deploys automatically from the repo.
      # This workflow validates the app is deployable and runs the test
      # suite as a pre-deploy gate. To connect:
      #
      # 1. Go to https://share.streamlit.io
      # 2. Connect this GitHub repo
      # 3. Set main file: streamlit_app.py
      # 4. Add secrets in Streamlit Cloud dashboard:
      #    - ANTHROPIC_API_KEY
      #    - BRAVE_SEARCH_API_KEY
      #    - OPENAI_API_KEY (optional)
      # ----------------------------------------------------------------

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Validated and ready for Streamlit Cloud" >> $GITHUB_STEP_SUMMARY
